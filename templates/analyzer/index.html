{% extends 'base.html' %}

{% block title %}Analyze Text{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <h3 class="mb-4">
                <i class="bi bi-pencil-square"></i> Analyze Text Sentiment
            </h3>
            <p class="text-muted">Enter a review, comment, or tweet to analyze its sentiment.</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.text.id_for_label }}" class="form-label fw-bold">
                        {{ form.text.label }}
                    </label>
                    {{ form.text }}
                </div>
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-magic"></i> Analyze
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
