<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sentiment Analysis{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; }
        .navbar-brand { font-weight: bold; }
        .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); border-radius: 12px; }
        .sentiment-positive { color: #198754; }
        .sentiment-negative { color: #dc3545; }
        .sentiment-badge { font-size: 1.1rem; padding: 8px 16px; border-radius: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">
            <i class="bi bi-chat-square-text"></i> Sentiment Analysis
        </a>
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'index' %}">
                <i class="bi bi-house"></i> Home
            </a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'history' %}">
                <i class="bi bi-clock-history"></i> History
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted py-4">
    <small>Sentiment Analysis System &copy; {% now "Y" %}</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
